# 协议解析节点 配置文件
#
# 该文件通过 launch 文件的 rosparam 方式加载到节点命名空间

# 云平台服务器地址
server_host: "127.0.0.1"

# 云平台服务器端口
server_port: 6000

# 机器人唯一标识 (UUID)
robot_uuid: "robot_001"

# 车辆类型 (0-无限制, 1-履带, 2-轮式, 3-四足, 4-其他)
vehicle_type: 1

# 固件版本号 (整形, 1.0.0 → 100)
fw_version: 100

# AES128 CBC 加密密钥 (16字节)
# 注意：部署时必须替换为实际密钥，与服务端保持一致
aes_key: "f7b4f15012de4e37"

# AES128 CBC 加密偏移量 (16字节)
aes_iv: "ad2fdc88772c0e95"

# 心跳间隔, 由登录响应协商后可刷新 (默认5000ms)
heartbeat_ms: 5000

# 断线重连间隔 (毫秒)
reconnect_ms: 5000